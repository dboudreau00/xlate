name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt required:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit, validation and regression tests (race detector)
        run: go test -race -count=1 ./...

      - name: end-to-end tests
        run: go test -tags e2e -count=1 -timeout 10m ./...

      - name: coverage
        run: |
          go test -covermode=atomic -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 1

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck -checks=all ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
